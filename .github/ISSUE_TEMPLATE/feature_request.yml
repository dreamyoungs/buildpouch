name: Feature request
description: Propose a focused improvement to BuildPouch.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the build-context problem and why current commands cannot solve it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest public interface that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain existing tools or workarounds you evaluated.
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Provide sanitized configuration and command examples when useful.
